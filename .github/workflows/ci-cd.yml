name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native C build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native library
        run: make all

      - name: Run C tests
        run: make tests

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x86_64
          path: |
            out/x86_64/librsc.a
            out/x86_64/librsc.so
            out/x86_64/repl

  rust-cross:
    name: Rust ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/rust

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build Rust crate
        run: cross build --manifest-path bindings/rust/Cargo.toml --release --target ${{ matrix.target }}

      - name: Run Rust tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --manifest-path bindings/rust/Cargo.toml --locked

      - name: Upload Rust target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.target }}
          path: bindings/rust/target/${{ matrix.target }}/release

  jar:
    name: Java JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install aarch64 toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build JAR
        run: make jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: rescaledb-jar
          path: out/multiarch.jar

  publish-crate:
    name: Publish crate
    runs-on: ubuntu-latest
    needs:
      - native
      - rust-cross
      - jar
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/rust

      - name: Package crate
        run: cargo package --manifest-path bindings/rust/Cargo.toml --locked

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --manifest-path bindings/rust/Cargo.toml --locked --token "$CARGO_REGISTRY_TOKEN"

      - name: Skip publish without token
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."

  publish-github-package:
    name: Publish GitHub Package
    runs-on: ubuntu-latest
    needs:
      - native
      - rust-cross
      - jar
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install aarch64 toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Publish to GitHub Packages
        run: make java-publish-github
