[package]
name = "rescaledb"
version = "0.1.3-pre"
edition = "2021"
description = "Safe Rust bindings for ReScaleDB - fast embedded SQL database, in-memory B+Tree with mmap"
license = "MIT"
readme = "README.md"
repository = "https://github.com/edgevane/ReScaleDB"
homepage = "https://github.com/edgevane/ReScaleDB"
keywords = ["database", "sql", "embedded", "b-tree", "mmap"]
categories = ["database", "embedded"]
authors = ["Aleksander Plominski"]
exclude = ["/target", "demo.dump"]

[lib]
name = "rescaledb"
path = "src/lib.rs"

[build-dependencies]
cc = "1.2"

[package.metadata.docs.rs]
all-features = true
