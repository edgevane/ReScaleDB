plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.aplominski'
version = '0.1.3-pre6'
description = 'ReScaleDB Java bindings - fast embedded SQL database'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'ReScaleDB'
                description = project.description
                url = 'https://github.com/edgevane/ReScaleDB'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'aplominski'
                        name = 'Aleksander Plominski'
                    }
                }

                scm {
                    url = 'https://github.com/edgevane/ReScaleDB'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('staging-deploy')
        }

        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/edgevane/ReScaleDB')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

def javaHome = System.getenv('JAVA_HOME') ?: '/usr/lib/jvm/java-26-openjdk'

task buildNative(type: Exec) {
    commandLine 'sh', '-c', """
        set -e

        mkdir -p src/main/resources/native/linux-x86_64
        mkdir -p src/main/resources/native/linux-aarch64

        gcc -fPIC -shared -O2 \\
            -I../../src \\
            -I${javaHome}/include \\
            -I${javaHome}/include/linux \\
            -o src/main/resources/native/linux-x86_64/librsc_jni.so \\
            ../../src/libs/string.c \\
            ../../src/libs/mem.c \\
            ../../src/arch/linux/arch.c \\
            ../../src/core/pager.c \\
            ../../src/core/btree.c \\
            ../../src/core/txn.c \\
            ../../src/core/dump.c \
            ../../src/core/debug.c \\
            ../../src/core/sql/parser.c \\
            ../../src/core/sql/exec_util.c \
            ../../src/core/sql/exec_ddl.c \
            ../../src/core/sql/exec_insert.c \
            ../../src/core/sql/exec_select.c \
            ../../src/core/sql/exec_write.c \
            ../../src/core/sql/exec_stmt.c \
            ../../src/core/sql/exec_query.c \\
            ../../src/core/sql/db.c \\
            src/main/c/rescaledb_jni.c

        if command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            aarch64-linux-gnu-gcc -fPIC -shared -O2 \\
                -I../../src \\
                -I${javaHome}/include \\
                -I${javaHome}/include/linux \\
                -o src/main/resources/native/linux-aarch64/librsc_jni.so \\
                ../../src/libs/string.c \\
                ../../src/libs/mem.c \\
                ../../src/arch/linux/arch.c \\
                ../../src/core/pager.c \\
                ../../src/core/btree.c \\
                ../../src/core/txn.c \\
                ../../src/core/dump.c \
            ../../src/core/debug.c \\
                ../../src/core/sql/parser.c \\
                ../../src/core/sql/exec_util.c \
            ../../src/core/sql/exec_ddl.c \
            ../../src/core/sql/exec_insert.c \
            ../../src/core/sql/exec_select.c \
            ../../src/core/sql/exec_write.c \
            ../../src/core/sql/exec_stmt.c \
            ../../src/core/sql/exec_query.c \\
                ../../src/core/sql/db.c \\
                src/main/c/rescaledb_jni.c

            echo "built aarch64"
        else
            echo "aarch64 cross compiler not found, skipping"
        fi

        # Keep the legacy native library path for compatibility.
        cp -f \\
            src/main/resources/native/linux-x86_64/librsc_jni.so \\
            src/main/resources/native/librsc_jni.so \\
            2>/dev/null || true
    """
}

processResources.dependsOn buildNative
